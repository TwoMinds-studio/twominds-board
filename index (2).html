<!DOCTYPE html>
<html lang="pl" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>TwoMinds Studio — Nowoczesna Tablica Brainstormingowa GDD</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #090b10;
      color: #f1f5f9;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      touch-action: none;
    }
    .font-mono-code {
      font-family: 'JetBrains Mono', monospace;
    }
    #board-canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
    .glass-surface {
      background: rgba(15, 19, 28, 0.85);
      backdrop-filter: blur(18px) saturate(160%);
      -webkit-backdrop-filter: blur(18px) saturate(160%);
      border: 1px solid rgba(255, 255, 255, 0.09);
      box-shadow: 0 18px 42px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.06);
    }
    .dock-btn {
      position: relative;
      transition: all 0.16s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .dock-btn:hover, .dock-btn:active {
      background: rgba(255, 255, 255, 0.12);
      transform: translateY(-1px);
    }
    .dock-btn.active {
      background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
      color: #ffffff;
      box-shadow: 0 6px 18px rgba(99, 102, 241, 0.45);
    }
    .swatch-dot {
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .swatch-dot.active {
      transform: scale(1.2);
      box-shadow: 0 0 0 2px #0f131c, 0 0 0 4px #a855f7;
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.7; }
      50% { opacity: 1; }
    }
    .brand-glow {
      animation: pulseGlow 4s infinite ease-in-out;
    }
  </style>
</head>
<body>
  <div id="app-root" class="relative w-full h-full overflow-hidden select-none">
    <canvas id="board-canvas"></canvas>

    <!-- Górny pasek nawigacji -->
    <header class="fixed top-3.5 left-3.5 right-3.5 z-20 flex flex-wrap items-center justify-between gap-2 pointer-events-none">
      <div class="glass-surface rounded-2xl px-3.5 py-2 flex items-center gap-3 pointer-events-auto">
        <div class="flex items-center gap-2.5 pr-3 border-r border-white/10">
          <div class="w-7 h-7 rounded-xl bg-gradient-to-br from-indigo-500 via-purple-500 to-amber-400 p-[1px] shadow-lg shadow-indigo-500/20">
            <div class="w-full h-full rounded-[11px] bg-[#0b0e16] flex items-center justify-center font-extrabold text-[11px] tracking-tighter text-white">
              2M
            </div>
          </div>
          <div class="leading-none">
            <div class="text-xs font-extrabold tracking-tight text-white flex items-center gap-1.5">
              TwoMinds <span class="text-[10px] font-mono-code px-1.5 py-0.5 rounded-md bg-indigo-500/20 text-indigo-300 border border-indigo-400/20">BOARD</span>
            </div>
            <div class="text-[10px] text-slate-400 mt-0.5">Projekt: Gang 3D • iPad Edition</div>
          </div>
        </div>

        <nav class="hidden xl:flex items-center gap-1 text-[11px] font-medium text-slate-300">
          <button data-jump="zone1" class="jump-btn px-2.5 py-1.5 rounded-xl hover:bg-white/10 hover:text-white transition">1. Tożsamość</button>
          <button data-jump="zone2" class="jump-btn px-2.5 py-1.5 rounded-xl hover:bg-white/10 hover:text-white transition">2. Pętla Gry</button>
          <button data-jump="zone3" class="jump-btn px-2.5 py-1.5 rounded-xl hover:bg-white/10 hover:text-white transition">3. Mapa v0.1</button>
          <button data-jump="zone4" class="jump-btn px-2.5 py-1.5 rounded-xl hover:bg-white/10 hover:text-white transition">4. Mechaniki</button>
          <button data-jump="zone5" class="jump-btn px-2.5 py-1.5 rounded-xl hover:bg-white/10 hover:text-white transition">5. Zakres v0.1</button>
        </nav>
      </div>

      <!-- Inspektor kontekstowy -->
      <div id="context-inspector" class="hidden glass-surface rounded-2xl px-3 py-1.5 flex items-center gap-2 pointer-events-auto">
        <span class="text-[10px] font-mono-code uppercase tracking-wider text-slate-400 px-1">Zaznaczono</span>
        <div class="h-4 w-px bg-white/10"></div>
        <div id="inspector-colors" class="flex items-center gap-1.5">
          <button data-card-style="amber" class="insp-style-btn w-5 h-5 rounded-full bg-amber-400/90 border border-white/30 hover:scale-110 transition" title="Bursztynowy"></button>
          <button data-card-style="sky" class="insp-style-btn w-5 h-5 rounded-full bg-sky-400/90 border border-white/30 hover:scale-110 transition" title="Błękitny"></button>
          <button data-card-style="emerald" class="insp-style-btn w-5 h-5 rounded-full bg-emerald-400/90 border border-white/30 hover:scale-110 transition" title="Szmaragdowy"></button>
          <button data-card-style="violet" class="insp-style-btn w-5 h-5 rounded-full bg-purple-400/90 border border-white/30 hover:scale-110 transition" title="Fioletowy"></button>
          <button data-card-style="rose" class="insp-style-btn w-5 h-5 rounded-full bg-rose-400/90 border border-white/30 hover:scale-110 transition" title="Karmazynowy"></button>
          <button data-card-style="slate" class="insp-style-btn w-5 h-5 rounded-full bg-slate-700 border border-white/30 hover:scale-110 transition" title="Grafitowy"></button>
        </div>
        <div class="h-4 w-px bg-white/10"></div>
        <button id="btn-insp-duplicate" class="px-2 py-1 rounded-lg text-[11px] font-medium text-slate-200 hover:bg-white/10 transition">Duplikuj</button>
        <button id="btn-insp-delete" class="px-2 py-1 rounded-lg text-[11px] font-medium text-rose-300 hover:bg-rose-500/20 transition">Usuń</button>
      </div>

      <!-- Prawy blok akcji -->
      <div class="glass-surface rounded-2xl p-1.5 flex items-center gap-1 pointer-events-auto">
        <button id="btn-undo" class="px-2.5 py-1.5 rounded-xl text-xs font-medium text-slate-300 hover:bg-white/10 transition" title="Cofnij">↶</button>
        <button id="btn-redo" class="px-2.5 py-1.5 rounded-xl text-xs font-medium text-slate-300 hover:bg-white/10 transition" title="Ponów">↷</button>
        <div class="h-4 w-px bg-white/10 mx-0.5"></div>
        <button id="btn-export-png" class="px-3 py-1.5 rounded-xl text-xs font-semibold bg-gradient-to-r from-indigo-500 to-purple-600 text-white shadow-md transition">Eksport</button>
        <button id="btn-reset-board" class="px-2.5 py-1.5 rounded-xl text-xs font-medium text-slate-400 hover:text-rose-300 transition">Reset</button>
      </div>
    </header>

    <!-- Pływający panel stylu rysowania -->
    <aside class="fixed left-3.5 top-1/2 -translate-y-1/2 z-20 glass-surface rounded-2xl p-2.5 flex flex-col items-center gap-3">
      <span class="text-[9px] font-mono-code uppercase tracking-widest text-slate-400">Kolor</span>
      <div id="color-swatches" class="flex flex-col gap-2.5">
        <button data-color="#f8fafc" class="swatch-dot active w-5 h-5 rounded-full bg-slate-100 border border-white/40"></button>
        <button data-color="#38bdf8" class="swatch-dot w-5 h-5 rounded-full bg-sky-400"></button>
        <button data-color="#a855f7" class="swatch-dot w-5 h-5 rounded-full bg-purple-500"></button>
        <button data-color="#34d399" class="swatch-dot w-5 h-5 rounded-full bg-emerald-400"></button>
        <button data-color="#fbbf24" class="swatch-dot w-5 h-5 rounded-full bg-amber-400"></button>
        <button data-color="#fb7185" class="swatch-dot w-5 h-5 rounded-full bg-rose-400"></button>
      </div>
      <div class="w-full h-px bg-white/10"></div>
      <span class="text-[9px] font-mono-code uppercase tracking-widest text-slate-400">Grubość</span>
      <div id="stroke-sizes" class="flex flex-col items-center gap-1.5">
        <button data-size="2" class="size-btn w-7 h-7 rounded-xl hover:bg-white/10 flex items-center justify-center transition"><span class="w-1.5 h-1.5 rounded-full bg-slate-200"></span></button>
        <button data-size="4" class="size-btn active w-7 h-7 rounded-xl bg-white/15 flex items-center justify-center transition"><span class="w-2.5 h-2.5 rounded-full bg-slate-200"></span></button>
        <button data-size="8" class="size-btn w-7 h-7 rounded-xl hover:bg-white/10 flex items-center justify-center transition"><span class="w-3.5 h-3.5 rounded-full bg-slate-200"></span></button>
      </div>
    </aside>

    <!-- Dolny dock narzędzi (dostosowany pod dotyk i palec) -->
    <div class="fixed bottom-4 left-1/2 -translate-x-1/2 z-20 glass-surface rounded-2xl p-1.5 flex items-center gap-1 max-w-[95vw] overflow-x-auto">
      <button data-tool="select" class="dock-btn active px-3.5 py-2.5 rounded-xl text-xs font-semibold text-slate-200 flex items-center gap-1.5">Wybór</button>
      <button data-tool="pan" class="dock-btn px-3.5 py-2.5 rounded-xl text-xs font-semibold text-slate-200 flex items-center gap-1.5">Przesuń</button>
      <div class="h-5 w-px bg-white/10 mx-0.5"></div>
      <button data-tool="pen" class="dock-btn px-3.5 py-2.5 rounded-xl text-xs font-semibold text-slate-200 flex items-center gap-1.5">Mazak</button>
      <button data-tool="sticky" class="dock-btn px-3.5 py-2.5 rounded-xl text-xs font-semibold text-slate-200 flex items-center gap-1.5">Karteczka</button>
      <button data-tool="text" class="dock-btn px-3.5 py-2.5 rounded-xl text-xs font-semibold text-slate-200 flex items-center gap-1.5">Tekst</button>
      <button data-tool="rect" class="dock-btn px-3.5 py-2.5 rounded-xl text-xs font-semibold text-slate-200 flex items-center gap-1.5">Ramka</button>
      <button data-tool="arrow" class="dock-btn px-3.5 py-2.5 rounded-xl text-xs font-semibold text-slate-200 flex items-center gap-1.5">Strzałka</button>
      <button data-tool="eraser" class="dock-btn px-3.5 py-2.5 rounded-xl text-xs font-semibold text-slate-200 flex items-center gap-1.5">Gumka</button>
    </div>

    <!-- Prawy dolny zoom -->
    <div class="fixed bottom-4 right-4 z-20 glass-surface rounded-2xl px-2.5 py-1.5 flex items-center gap-1.5 text-xs font-semibold text-slate-200">
      <button id="btn-zoom-out" class="w-8 h-8 rounded-xl hover:bg-white/10 flex items-center justify-center text-lg transition">−</button>
      <span id="zoom-label" class="w-12 text-center font-mono-code text-[11px] text-slate-300">100%</span>
      <button id="btn-zoom-in" class="w-8 h-8 rounded-xl hover:bg-white/10 flex items-center justify-center text-lg transition">+</button>
      <div class="h-4 w-px bg-white/10"></div>
      <button id="btn-fit-view" class="px-3 py-1.5 rounded-xl hover:bg-white/10 text-[11px] font-semibold text-indigo-300 transition">Dopasuj</button>
    </div>

    <!-- Edytor tekstowy -->
    <div id="inline-editor-wrap" class="hidden fixed z-30">
      <textarea id="inline-editor" class="w-full h-full p-3 rounded-2xl border-2 border-indigo-400 bg-[#0d121d]/95 text-slate-100 shadow-2xl resize-none focus:outline-none text-xs leading-relaxed"></textarea>
    </div>

    <div id="toast-area" class="fixed top-20 left-1/2 -translate-x-1/2 z-40 flex flex-col items-center gap-1.5 pointer-events-none"></div>
  </div>

  <script>
    const STORAGE_KEY = "twominds_modern_board_v3";
    const canvas = document.getElementById("board-canvas");
    const ctx = canvas.getContext("2d");

    let camera = { x: 100, y: 90, zoom: 0.72 };
    let lastPointerWorld = { x: 400, y: 300 };

    let currentTool = "select";
    let currentColor = "#f8fafc";
    let currentStrokeSize = 4;

    let elements = [];
    let undoStack = [];
    let redoStack = [];
    let selectedId = null;

    let isPointerDown = false;
    let dragMode = null; 
    let dragStartWorld = { x: 0, y: 0 };
    let dragStartScreen = { x: 0, y: 0 };
    let elementStartBounds = null;
    let activeDraftElement = null;
    let editingElementId = null;

    const imageCache = new Map();

    const CARD_THEMES = {
      amber: { bg: "rgba(38, 28, 16, 0.92)", border: "#f59e0b", headerBg: "rgba(245, 158, 11, 0.16)", accent: "#fbbf24", text: "#fef3c7" },
      sky: { bg: "rgba(14, 29, 44, 0.92)", border: "#38bdf8", headerBg: "rgba(56, 189, 248, 0.16)", accent: "#7dd3fc", text: "#e0f2fe" },
      emerald: { bg: "rgba(13, 35, 29, 0.92)", border: "#10b981", headerBg: "rgba(16, 185, 129, 0.16)", accent: "#6ee7b7", text: "#d1fae5" },
      violet: { bg: "rgba(28, 19, 46, 0.92)", border: "#a855f7", headerBg: "rgba(168, 85, 247, 0.18)", accent: "#d8b4fe", text: "#f3e8ff" },
      rose: { bg: "rgba(42, 16, 25, 0.92)", border: "#f43f5e", headerBg: "rgba(244, 63, 94, 0.18)", accent: "#fda4af", text: "#ffe4e6" },
      slate: { bg: "rgba(22, 27, 38, 0.94)", border: "#64748b", headerBg: "rgba(148, 163, 184, 0.14)", accent: "#cbd5e1", text: "#f1f5f9" }
    };

    function showToast(msg, tone = "indigo") {
      const area = document.getElementById("toast-area");
      const el = document.createElement("div");
      const tones = {
        indigo: "bg-slate-900/95 text-indigo-100 border-indigo-400/40",
        success: "bg-slate-900/95 text-emerald-200 border-emerald-400/40",
        warn: "bg-slate-900/95 text-amber-200 border-amber-400/40"
      };
      el.className = `px-4 py-2 rounded-xl border text-xs font-semibold shadow-2xl backdrop-blur-md transition-all duration-300 ${tones[tone] || tones.indigo}`;
      el.textContent = msg;
      area.appendChild(el);
      setTimeout(() => {
        el.style.opacity = "0";
        el.style.transform = "translateY(-6px)";
        setTimeout(() => el.remove(), 260);
      }, 2600);
    }

    function uid() {
      return "tm_" + Math.random().toString(36).slice(2, 9) + Date.now().toString(36);
    }

    function pushHistory() {
      undoStack.push(JSON.stringify(elements));
      if (undoStack.length > 50) undoStack.shift();
      redoStack = [];
    }

    function saveBoard() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({ elements, camera }));
      } catch (e) {
        console.warn("Błąd zapisu:", e);
      }
    }

    function loadBoard() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return false;
        const parsed = JSON.parse(raw);
        if (parsed && Array.isArray(parsed.elements) && parsed.elements.length > 0) {
          elements = parsed.elements;
          if (parsed.camera) camera = parsed.camera;
          return true;
        }
      } catch (e) {
        console.warn("Błąd odczytu:", e);
      }
      return false;
    }

    function buildTwoMindsTemplate() {
      const items = [];
      items.push({ id: uid(), type: "text", x: 60, y: -18, w: 1200, h: 56, text: "TWOMINDS STUDIO • GDD: GANG 3D (IPAD EDITION)", color: "#f8fafc", fontSize: 22, bold: true });
      
      // Strefa 1
      items.push({ id: uid(), type: "rect", x: 60, y: 60, w: 630, h: 610, color: "#38bdf8", fill: "rgba(14, 24, 38, 0.55)", strokeWidth: 2, label: "01 // TOŻSAMOŚĆ GANGU" });
      items.push({ id: uid(), type: "sticky", x: 90, y: 118, w: 270, h: 215, theme: "sky", badge: "WIZJA", text: "• Stylizowany świat 3D\n• Kampania ze znajomymi\n• Trwały świat i postęp" });
      items.push({ id: uid(), type: "sticky", x: 388, y: 118, w: 270, h: 215, theme: "amber", badge: "POJAZDY", text: "• Motocykle i auta\n• Swobodna jazda po mieście\n• Unikalny model jazdy" });

      elements = items;
      saveBoard();
    }

    // Inicjalizacja rozmiarów płótna
    function resizeCanvas() {
      const dpr = window.devicePixelRatio || 1;
      canvas.width = window.innerWidth * dpr;
      canvas.height = window.innerHeight * dpr;
      ctx.scale(dpr, dpr);
      render();
    }
    window.addEventListener("resize", resizeCanvas);

    function screenToWorld(sx, sy) {
      return {
        x: (sx - camera.x) / camera.zoom,
        y: (sy - camera.y) / camera.zoom
      };
    }

    function worldToScreen(wx, wy) {
      return {
        x: wx * camera.zoom + camera.x,
        y: wy * camera.zoom + camera.y
      };
    }

    // Główna pętla renderowania
    function render() {
      ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);

      ctx.save();
      ctx.translate(camera.x, camera.y);
      ctx.scale(camera.zoom, camera.zoom);

      // Siatka tła
      drawGrid();

      // Renderowanie elementów
      elements.forEach(el => {
        drawElement(el);
        if (el.id === selectedId) {
          drawSelectionBox(el);
        }
      });

      // Aktywny rysowany element / kształt
      if (activeDraftElement) {
        drawElement(activeDraftElement);
      }

      ctx.restore();
    }

    function drawGrid() {
      const step = 80;
      const left = -camera.x / camera.zoom;
      const top = -camera.y / camera.zoom;
      const right = left + window.innerWidth / camera.zoom;
      const bottom = top + window.innerHeight / camera.zoom;

      const startX = Math.floor(left / step) * step;
      const startY = Math.floor(top / step) * step;

      ctx.strokeStyle = "rgba(255, 255, 255, 0.035)";
      ctx.lineWidth = 1 / camera.zoom;

      ctx.beginPath();
      for (let x = startX; x < right; x += step) {
        ctx.moveTo(x, top);
        ctx.lineTo(x, bottom);
      }
      for (let y = startY; y < bottom; y += step) {
        ctx.moveTo(left, y);
        ctx.lineTo(right, y);
      }
      ctx.stroke();
    }

    function drawElement(el) {
      ctx.save();
      if (el.type === "rect") {
        ctx.fillStyle = el.fill || "rgba(15, 19, 28, 0.4)";
        ctx.strokeStyle = el.color || "#38bdf8";
        ctx.lineWidth = (el.strokeWidth || 2);
        ctx.beginPath();
        ctx.roundRect(el.x, el.y, el.w, el.h, 16);
        ctx.fill();
        ctx.stroke();

        if (el.label) {
          ctx.fillStyle = el.color || "#38bdf8";
          ctx.font = "bold 12px Inter, sans-serif";
          ctx.fillText(el.label, el.x + 16, el.y + 26);
        }
      } else if (el.type === "sticky") {
        const theme = CARD_THEMES[el.theme] || CARD_THEMES.sky;
        ctx.fillStyle = theme.bg;
        ctx.strokeStyle = theme.border;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.roundRect(el.x, el.y, el.w, el.h, 12);
        ctx.fill();
        ctx.stroke();

        if (el.badge) {
          ctx.fillStyle = theme.headerBg;
          ctx.beginPath();
          ctx.roundRect(el.x + 12, el.y + 12, el.w - 24, 24, 6);
          ctx.fill();

          ctx.fillStyle = theme.accent;
          ctx.font = "bold 10px JetBrains Mono, monospace";
          ctx.fillText(el.badge, el.x + 20, el.y + 28);
        }

        ctx.fillStyle = theme.text;
        ctx.font = "11px Inter, sans-serif";
        wrapText(ctx, el.text || "", el.x + 16, el.y + 52, el.w - 32, 16);
      } else if (el.type === "text") {
        ctx.fillStyle = el.color || "#f8fafc";
        ctx.font = `${el.bold ? "bold " : ""}${el.fontSize || 14}px Inter, sans-serif`;
        ctx.fillText(el.text || "", el.x, el.y + (el.fontSize || 14));
      } else if (el.type === "pen" || el.type === "highlighter") {
        if (!el.points || el.points.length < 2) return;
        ctx.strokeStyle = el.color;
        ctx.lineWidth = el.size;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        if (el.type === "highlighter") ctx.globalAlpha = 0.35;

        ctx.beginPath();
        ctx.moveTo(el.points[0].x, el.points[0].y);
        for (let i = 1; i < el.points.length; i++) {
          ctx.lineTo(el.points[i].x, el.points[i].y);
        }
        ctx.stroke();
      } else if (el.type === "arrow") {
        ctx.strokeStyle = el.color || "#94a3b8";
        ctx.lineWidth = el.strokeWidth || 3;
        ctx.beginPath();
        ctx.moveTo(el.x1, el.y1);
        ctx.lineTo(el.x2, el.y2);
        ctx.stroke();

        const angle = Math.atan2(el.y2 - el.y1, el.x2 - el.x1);
        ctx.fillStyle = el.color || "#94a3b8";
        ctx.beginPath();
        ctx.moveTo(el.x2, el.y2);
        ctx.lineTo(el.x2 - 12 * Math.cos(angle - Math.PI / 6), el.y2 - 12 * Math.sin(angle - Math.PI / 6));
        ctx.lineTo(el.x2 - 12 * Math.cos(angle + Math.PI / 6), el.y2 - 12 * Math.sin(angle + Math.PI / 6));
        ctx.fill();
      }
      ctx.restore();
    }

    function wrapText(context, text, x, y, maxWidth, lineHeight) {
      const paragraphs = text.split("\n");
      let currentY = y;
      for (let p = 0; p < paragraphs.length; p++) {
        const words = paragraphs[p].split(" ");
        let line = "";
        for (let n = 0; n < words.length; n++) {
          const testLine = line + words[n] + " ";
          const metrics = context.measureText(testLine);
          if (metrics.width > maxWidth && n > 0) {
            context.fillText(line, x, currentY);
            line = words[n] + " ";
            currentY += lineHeight;
          } else {
            line = testLine;
          }
        }
        context.fillText(line, x, currentY);
        currentY += lineHeight;
      }
    }

    function drawSelectionBox(el) {
      let b = getElementBounds(el);
      ctx.strokeStyle = "#6366f1";
      ctx.lineWidth = 1.5 / camera.zoom;
      ctx.setLineDash([4, 4]);
      ctx.strokeRect(b.x - 4, b.y - 4, b.w + 8, b.h + 8);
      ctx.setLineDash([]);
    }

    function getElementBounds(el) {
      if (el.type === "rect" || el.type === "sticky") {
        return { x: el.x, y: el.y, w: el.w, h: el.h };
      } else if (el.type === "text") {
        return { x: el.x, y: el.y, w: 150, h: 24 };
      } else if (el.type === "arrow") {
        return { x: Math.min(el.x1, el.x2), y: Math.min(el.y1, el.y2), w: Math.abs(el.x2 - el.x1), h: Math.abs(el.y2 - el.y1) };
      } else if (el.type === "pen" || el.type === "highlighter") {
        let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
        el.points.forEach(p => {
          if (p.x < minX) minX = p.x;
          if (p.y < minY) minY = p.y;
          if (p.x > maxX) maxX = p.x;
          if (p.y > maxY) maxY = p.y;
        });
        return { x: minX, y: minY, w: maxX - minX || 10, h: maxY - minY || 10 };
      }
      return { x: el.x || 0, y: el.y || 0, w: 50, h: 50 };
    }

    function hitTest(wx, wy, el) {
      let b = getElementBounds(el);
      return wx >= b.x && wx <= b.x + b.w && wy >= b.y && wy <= b.y + b.h;
    }

    // --- OBSŁUGA ZDARZEŃ DOTYKOWYCH I MYSZY (iPad Ready) ---
    function getClientCoords(e) {
      if (e.touches && e.touches.length > 0) {
        return { x: e.touches[0].clientX, y: e.touches[0].clientY };
      }
      return { x: e.clientX, y: e.clientY };
    }

    canvas.addEventListener("pointerdown", (e) => {
      isPointerDown = true;
      const coords = getClientCoords(e);
      dragStartScreen = { x: coords.x, y: coords.y };
      const world = screenToWorld(coords.x, coords.y);
      dragStartWorld = world;
      lastPointerWorld = world;

      if (currentTool === "pan" || e.button === 1 || e.shiftKey) {
        dragMode = "pan";
        return;
      }

      if (currentTool === "select") {
        let foundId = null;
        for (let i = elements.length - 1; i >= 0; i--) {
          if (hitTest(world.x, world.y, elements[i])) {
            foundId = elements[i].id;
            break;
          }
        }
        selectedId = foundId;
        updateInspectorUI();

        if (selectedId) {
          dragMode = "move";
          const el = elements.find(item => item.id === selectedId);
          elementStartBounds = { x: el.x, y: el.y };
        } else {
          dragMode = null;
        }
        render();
      } else if (currentTool === "pen" || currentTool === "highlighter") {
        dragMode = "draw";
        pushHistory();
        activeDraftElement = {
          id: uid(),
          type: currentTool,
          color: currentColor,
          size: currentStrokeSize,
          points: [{ x: world.x, y: world.y }]
        };
      } else if (currentTool === "sticky") {
        pushHistory();
        const newEl = {
          id: uid(),
          type: "sticky",
          x: world.x - 120,
          y: world.y - 80,
          w: 240,
          h: 160,
          theme: "sky",
          badge: "NOWA NOTATKA",
          text: "Wpisz treść..."
        };
        elements.push(newEl);
        selectedId = newEl.id;
        currentTool = "select";
        updateToolbarUI();
        updateInspectorUI();
        saveBoard();
        render();
      } else if (currentTool === "text") {
        pushHistory();
        const newEl = {
          id: uid(),
          type: "text",
          x: world.x,
          y: world.y,
          text: "Nowy tekst",
          color: currentColor,
          fontSize: 16,
          bold: false
        };
        elements.push(newEl);
        selectedId = newEl.id;
        currentTool = "select";
        updateToolbarUI();
        updateInspectorUI();
        saveBoard();
        render();
      } else if (currentTool === "rect") {
        dragMode = "shape";
        pushHistory();
        activeDraftElement = {
          id: uid(),
          type: "rect",
          x: world.x,
          y: world.y,
          w: 10,
          h: 10,
          color: currentColor,
          fill: "rgba(15, 19, 28, 0.5)",
          strokeWidth: 2,
          label: "SEKCJA"
        };
      } else if (currentTool === "arrow") {
        dragMode = "shape";
        pushHistory();
        activeDraftElement = {
          id: uid(),
          type: "arrow",
          x1: world.x,
          y1: world.y,
          x2: world.x + 10,
          y2: world.y + 10,
          color: currentColor,
          strokeWidth: 3
        };
      }
    });

    canvas.addEventListener("pointermove", (e) => {
      if (!isPointerDown) return;
      const coords = getClientCoords(e);
      const world = screenToWorld(coords.x, coords.y);

      if (dragMode === "pan") {
        camera.x += coords.x - dragStartScreen.x;
        camera.y += coords.y - dragStartScreen.y;
        dragStartScreen = { x: coords.x, y: coords.y };
        render();
        return;
      }

      if (dragMode === "move" && selectedId) {
        const dx = world.x - dragStartWorld.x;
        const dy = world.y - dragStartWorld.y;
        const el = elements.find(item => item.id === selectedId);
        if (el) {
          el.x = elementStartBounds.x + dx;
          el.y = elementStartBounds.y + dy;
          render();
        }
      } else if (dragMode === "draw" && activeDraftElement) {
        activeDraftElement.points.push({ x: world.x, y: world.y });
        render();
      } else if (dragMode === "shape" && activeDraftElement) {
        if (activeDraftElement.type === "rect") {
          activeDraftElement.w = world.x - activeDraftElement.x;
          activeDraftElement.h = world.y - activeDraftElement.y;
        } else if (activeDraftElement.type === "arrow") {
          activeDraftElement.x2 = world.x;
          activeDraftElement.y2 = world.y;
        }
        render();
      }
    });

    canvas.addEventListener("pointerup", () => {
      if (!isPointerDown) return;
      isPointerDown = false;

      if (dragMode === "draw" && activeDraftElement) {
        elements.push(activeDraftElement);
        activeDraftElement = null;
        saveBoard();
      } else if (dragMode === "shape" && activeDraftElement) {
        if (activeDraftElement.type === "rect") {
          if (activeDraftElement.w < 0) { activeDraftElement.x += activeDraftElement.w; activeDraftElement.w = Math.abs(activeDraftElement.w); }
          if (activeDraftElement.h < 0) { activeDraftElement.y += activeDraftElement.h; activeDraftElement.h = Math.abs(activeDraftElement.h); }
        }
        elements.push(activeDraftElement);
        activeDraftElement = null;
        saveBoard();
      } else if (dragMode === "move") {
        saveBoard();
      }
      dragMode = null;
      render();
    });

    // Płynne przybliżanie dwoma palcami / kółkiem myszy
    canvas.addEventListener("wheel", (e) => {
      e.preventDefault();
      const zoomFactor = e.deltaY < 0 ? 1.08 : 0.92;
      const newZoom = Math.min(Math.max(camera.zoom * zoomFactor, 0.2), 3);
      
      const mouseWorld = screenToWorld(e.clientX, e.clientY);
      camera.zoom = newZoom;
      camera.x = e.clientX - mouseWorld.x * camera.zoom;
      camera.y = e.clientY - mouseWorld.y * camera.zoom;
      
      document.getElementById("zoom-label").textContent = Math.round(camera.zoom * 100) + "%";
      render();
    }, { passive: false });

    // UI Controls
    function updateToolbarUI() {
      document.querySelectorAll("[data-tool]").forEach(btn => {
        if (btn.dataset.tool === currentTool) btn.classList.add("active");
        else btn.classList.remove("active");
      });
    }

    function updateInspectorUI() {
      const inspector = document.getElementById("context-inspector");
      if (selectedId) inspector.classList.remove("hidden");
      else inspector.classList.add("hidden");
    }

    document.querySelectorAll("[data-tool]").forEach(btn => {
      btn.addEventListener("click", () => {
        currentTool = btn.dataset.tool;
        updateToolbarUI();
      });
    });

    document.querySelectorAll("[data-color]").forEach(btn => {
      btn.addEventListener("click", () => {
        currentColor = btn.dataset.color;
        document.querySelectorAll("[data-color]").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
      });
    });

    document.querySelectorAll(".size-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        currentStrokeSize = parseInt(btn.dataset.size);
        document.querySelectorAll(".size-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
      });
    });

    document.getElementById("btn-zoom-in").addEventListener("click", () => {
      camera.zoom = Math.min(camera.zoom * 1.15, 3);
      document.getElementById("zoom-label").textContent = Math.round(camera.zoom * 100) + "%";
      render();
    });

    document.getElementById("btn-zoom-out").addEventListener("click", () => {
      camera.zoom = Math.max(camera.zoom / 1.15, 0.2);
      document.getElementById("zoom-label").textContent = Math.round(camera.zoom * 100) + "%";
      render();
    });

    document.getElementById("btn-fit-view").addEventListener("click", () => {
      camera.x = 100;
      camera.y = 90;
      camera.zoom = 0.72;
      document.getElementById("zoom-label").textContent = "72%";
      render();
      showToast("Widok zresetowany", "success");
    });

    document.getElementById("btn-reset-board").addEventListener("click", () => {
      if (confirm("Zresetować tablicę do szablonu TwoMinds?")) {
        buildTwoMindsTemplate();
        render();
        showToast("Załadowano szablon", "success");
      }
    });

    document.getElementById("btn-undo").addEventListener("click", () => {
      if (undoStack.length === 0) return;
      redoStack.push(JSON.stringify(elements));
      elements = JSON.parse(undoStack.pop());
      selectedId = null;
      updateInspectorUI();
      saveBoard();
      render();
      showToast("Cofnięto zmianę");
    });

    document.getElementById("btn-redo").addEventListener("click", () => {
      if (redoStack.length === 0) return;
      undoStack.push(JSON.stringify(elements));
      elements = JSON.parse(redoStack.pop());
      selectedId = null;
      updateInspectorUI();
      saveBoard();
      render();
      showToast("Ponowiono zmianę");
    });

    document.getElementById("btn-insp-delete").addEventListener("click", () => {
      if (!selectedId) return;
      pushHistory();
      elements = elements.filter(el => el.id !== selectedId);
      selectedId = null;
      updateInspectorUI();
      saveBoard();
      render();
      showToast("Usunięto element");
    });

    // Start aplikacji
    if (!loadBoard()) {
      buildTwoMindsTemplate();
    }
    resizeCanvas();
  </script>
</body>
</html>
